<!doctype html>
<html lang="vi" class="h-full w-full bg-black overflow-hidden select-none">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Shield against Web3 wallet extensions collision (MetaMask / Coinbase / OKX) & stream worker / codec errors
      (function() {
        try {
          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if (obj === window && prop === 'ethereum') {
              try {
                return origDefineProperty.call(this, obj, prop, Object.assign({}, descriptor, { configurable: true }));
              } catch (_) {
                return obj;
              }
            }
            return origDefineProperty.apply(this, arguments);
          };
        } catch (_) {}

        var origConsoleError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          var msg = typeof firstArg === 'string' ? firstArg : (firstArg && firstArg.message ? String(firstArg.message) : '');
          if (
            msg.indexOf('ec-3') !== -1 ||
            msg.indexOf('addSourceBuffer') !== -1 ||
            msg.indexOf('ethereum') !== -1 ||
            msg.indexOf('currentURL') !== -1 ||
            msg.indexOf('Expected MediaSource to be open') !== -1 ||
            msg.indexOf('MediaSource to be open') !== -1 ||
            msg.indexOf('reopening the media source') !== -1 ||
            msg.indexOf('Shaka Error 3015') !== -1 ||
            msg.indexOf('MEDIA_SOURCE_OPERATION_THREW') !== -1 ||
            msg.indexOf('Shaka Error 4000') !== -1
          ) {
            if (console.warn) {
              console.warn.apply(console, arguments);
            }
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          if (e && e.message) {
            if (
              e.message.indexOf('ethereum') !== -1 ||
              e.message.indexOf('currentURL') !== -1 ||
              e.message.indexOf('addSourceBuffer') !== -1 ||
              e.message.indexOf('ec-3') !== -1 ||
              e.message.indexOf('Expected MediaSource to be open') !== -1 ||
              e.message.indexOf('MediaSource to be open') !== -1 ||
              e.message.indexOf('reopening the media source') !== -1 ||
              e.message.indexOf('Shaka Error 3015') !== -1 ||
              e.message.indexOf('MEDIA_SOURCE_OPERATION_THREW') !== -1 ||
              e.message.indexOf('Shaka Error 4000') !== -1
            ) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && e.reason.message) {
            if (
              e.reason.message.indexOf('ethereum') !== -1 ||
              e.reason.message.indexOf('currentURL') !== -1 ||
              e.reason.message.indexOf('addSourceBuffer') !== -1 ||
              e.reason.message.indexOf('ec-3') !== -1 ||
              e.reason.message.indexOf('Expected MediaSource to be open') !== -1 ||
              e.reason.message.indexOf('MediaSource to be open') !== -1 ||
              e.reason.message.indexOf('reopening the media source') !== -1
            ) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HT TV</title>
    <meta name="description" content="Ứng dụng truyền hình HT TV tối ưu cho Android TV, Android TV Box và Mobile hỗ trợ HLS, MPD, Widevine & ClearKey DRM." />
    <meta property="og:title" content="HT TV" />
    <meta property="og:description" content="Ứng dụng truyền hình HT TV tối ưu cho Android TV, Android TV Box và Mobile hỗ trợ HLS, MPD, Widevine & ClearKey DRM." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        box-sizing: border-box;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        overflow: hidden;
        overscroll-behavior-y: none;
        overscroll-behavior-x: none;
        touch-action: pan-x pan-y;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(239, 68, 68, 0.8);
      }
      /* Triệt tiêu hoàn toàn khung xám và nút Play hình bầu dục mặc định của trình duyệt */
      video {
        outline: none !important;
        border: none !important;
        background-color: #000000 !important;
        box-shadow: none !important;
        -webkit-tap-highlight-color: transparent !important;
      }
      video::-webkit-media-controls,
      video::-webkit-media-controls-enclosure,
      video::-webkit-media-controls-panel,
      video::-webkit-media-controls-play-button,
      video::-webkit-media-controls-start-playback-button,
      video::-webkit-media-controls-overlay-play-button,
      video::-webkit-media-controls-overlay-enclosure,
      video::-webkit-media-controls-current-time-display,
      video::-webkit-media-controls-time-remaining-display,
      video::-webkit-media-controls-timeline,
      video::-webkit-media-controls-volume-slider,
      video::-webkit-media-controls-mute-button,
      video::-webkit-media-controls-fullscreen-button,
      video::-webkit-media-controls-toggle-closed-captions-button,
      video::-internal-media-controls-overlay-cast-button,
      video::-internal-media-controls-cast-button,
      *::-webkit-media-controls-panel,
      *::-webkit-media-controls-play-button,
      *::-webkit-media-controls-start-playback-button,
      *::-webkit-media-controls-overlay-play-button,
      video::-moz-media-controls,
      video::-moz-media-controls-overlay-play-button {
        display: none !important;
        -webkit-appearance: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
      }
    </style>
  </head>
  <body class="h-full w-full bg-black text-white antialiased overflow-hidden">
    <div id="root" class="h-full w-full"></div>
