name: Update Sports M3U

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  update-sports:
    runs-on: ubuntu-latest
    steps:
      - name: Download sports.m3u from IPTV-org
        run: curl -fL --retry 3 --connect-timeout 20 -o sports.m3u https://iptv-org.github.io/iptv/categories/sports.m3u

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports.m3u
          if git diff --cached --quiet; then
            echo "sports.m3u is already up to date"
          else
            git commit -m "Update sports.m3u from IPTV-org"
            git push
          fi
